services:
  app:
    build:
      context: .
    container_name: skilltime_app
    env_file:
      - .env
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    ports:
      - "${APP_PORT:-8000}:8000"

  postgres:
    image: postgres:16
    container_name: skilltime_postgres
    restart: always
    platform: linux/amd64
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: skilltime_redis
    restart: always
    platform: linux/amd64
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: skilltime_mailhog
    restart: always
    platform: linux/amd64
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  uploads: